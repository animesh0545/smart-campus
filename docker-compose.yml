# Local development stack: build and test everything while AWS provisions.
#   docker compose up --build            -> API on http://localhost:8080
#   docker compose --profile flink up    -> also a local Flink 1.18 cluster (UI :8081)
# DynamoDB Local / Kafka / ZooKeeper / Postgres stand in for DynamoDB / MSK / ZooKeeper / RDS.
# SQS, S3 and the Lambda are AWS-only (publishing is skipped when not configured).

x-svc: &svc
  build:
    context: .
    dockerfile: services/Dockerfile
  restart: unless-stopped
  environment: &env
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: local
    AWS_SECRET_ACCESS_KEY: local
    DYNAMODB_ENDPOINT: http://dynamodb:8000
    KAFKA_BOOTSTRAP: kafka:9092
    KAFKA_REPLICATION: "1"
    NODE_TABLES: '{"node-0":"smart-campus-bookings-node-0","node-1":"smart-campus-bookings-node-1","node-2":"smart-campus-bookings-node-2","node-3":"smart-campus-bookings-node-3"}'
    INITIAL_NODES: node-0,node-1,node-2
    ANALYTICS_TABLE: smart-campus-analytics-results
    NOTIFICATIONS_TABLE: smart-campus-notifications
    DB_HOST: postgres
    DB_USER: campusadmin
    DB_PASSWORD: campus
    ZK_HOSTS: zookeeper:2181
    USER_SERVICE_URL: http://user-service:8000
    RESOURCE_REGISTRY_URL: http://resource-registry:8000
    AVAILABILITY_GRPC: dns:///availability:50051
    PARTITION_GRPC: dns:///partition-manager:50051
  depends_on: [postgres, zookeeper, kafka, dynamodb]

services:
  # ------------------------------------------------------------ backing services
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campusadmin
      POSTGRES_PASSWORD: campus
      POSTGRES_DB: campus
    ports: ["5432:5432"]

  zookeeper:
    image: zookeeper:3.9.3   # same image as Lab 8
    ports: ["2181:2181"]

  kafka:
    image: apache/kafka:3.9.0
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3

  dynamodb:
    image: amazon/dynamodb-local:2.5.3
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports: ["8000:8000"]

  # ------------------------------------------------------------ the microservices
  user-service:
    <<: *svc
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: user-service } }
    environment: { <<: *env, SERVICE_NAME: user-service }

  resource-registry:
    <<: *svc
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: resource-registry } }
    environment: { <<: *env, SERVICE_NAME: resource-registry }

  partition-manager:
    <<: *svc
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: partition-manager } }
    environment: { <<: *env, SERVICE_NAME: partition-manager }

  availability:
    <<: *svc
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: availability } }
    environment: { <<: *env, SERVICE_NAME: availability }
    depends_on: [partition-manager, dynamodb]

  room-booking:
    <<: *svc
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: room-booking } }
    environment: { <<: *env, SERVICE_NAME: room-booking }
    depends_on: [availability, partition-manager, user-service, resource-registry, kafka]

  equipment-booking:
    <<: *svc
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: equipment-booking } }
    environment: { <<: *env, SERVICE_NAME: equipment-booking }
    depends_on: [availability, partition-manager, user-service, resource-registry, kafka]

  usage-analytics:
    <<: *svc
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: usage-analytics } }
    environment: { <<: *env, SERVICE_NAME: usage-analytics }

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./services/gateway/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:8080"]
    depends_on: [user-service, resource-registry, room-booking, equipment-booking, availability,
                 partition-manager, usage-analytics]

  # ------------------------------------------------------------ optional local Flink (profile "flink")
  flink-jobmanager:
    profiles: ["flink"]
    image: flink:1.18.1-java11
    command: jobmanager
    ports: ["8081:8081"]
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"
    volumes:
      - ./analytics-flink/target:/opt/jobs:ro

  flink-taskmanager:
    profiles: ["flink"]
    image: flink:1.18.1-java11
    command: taskmanager
    depends_on: [flink-jobmanager]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
