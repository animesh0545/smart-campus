# Our own manifests, tracked from this Git repo:
#   observability-config : PodMonitor, Grafana dashboard, alert rules (needs kps CRDs)
#   smart-campus         : the 8-service application (Kustomize; CI bumps image tags)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: gitops/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true   # CRDs come from kube-prometheus-stack
    retry: { limit: 15, backoff: { duration: 20s, factor: 2, maxDuration: 3m } }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smart-campus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: gitops/apps/smart-campus
  destination:
    server: https://kubernetes.default.svc
    namespace: smart-campus
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    retry: { limit: 10, backoff: { duration: 15s, factor: 2, maxDuration: 3m } }
  # The HPA owns .spec.replicas of the two autoscaled Deployments only; every
  # other Deployment is self-healed back to the replica count in Git.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: availability
      jsonPointers: [/spec/replicas]
    - group: apps
      kind: Deployment
      name: room-booking
      jsonPointers: [/spec/replicas]
