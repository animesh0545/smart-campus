# Grafana dashboard (requirement h). The Grafana sidecar loads every ConfigMap
# labelled grafana_dashboard=1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: smart-campus-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  smart-campus-overview.json: |
    {
      "title": "Smart Campus - Services & Cluster",
      "uid": "smart-campus-overview",
      "tags": [
        "smart-campus",
        "assignment"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "prometheus",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          },
          {
            "name": "loki",
            "label": "Loki",
            "type": "datasource",
            "query": "loki",
            "current": {},
            "hide": 0
          },
          {
            "name": "app",
            "label": "service",
            "type": "custom",
            "query": "user-service,resource-registry,room-booking,equipment-booking,availability,partition-manager,usage-analytics,gateway,zookeeper",
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            }
          },
          {
            "name": "search",
            "label": "log contains",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            }
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Service golden signals (RPS, errors, latency)",
          "id": 1,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Total RPS",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_requests_total[1m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              }
            }
          ]
        },
        {
          "type": "stat",
          "title": "Error rate (5xx)",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_requests_total{status=~\"5..\"}[1m])) / clamp_min(sum(rate(http_requests_total[1m])),1e-9)",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              }
            }
          ]
        },
        {
          "type": "stat",
          "title": "p95 latency",
          "id": 4,
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.5
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[1m])))",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              }
            }
          ]
        },
        {
          "type": "stat",
          "title": "409 conflicts / s",
          "id": 5,
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_requests_total{status=\"409\"}[1m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              }
            }
          ]
        },
        {
          "type": "stat",
          "title": "gRPC calls / s",
          "id": 6,
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(grpc_server_requests_total[1m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              }
            }
          ]
        },
        {
          "type": "stat",
          "title": "Events published / s",
          "id": 7,
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(events_published_total{result=\"ok\"}[1m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Requests per second by service",
          "id": 8,
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (service) (rate(http_requests_total[1m]))",
              "legendFormat": "{{service}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Error rate by service (4xx / 5xx)",
          "id": 9,
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (service) (rate(http_requests_total{status=~\"5..\"}[1m])) / clamp_min(sum by (service) (rate(http_requests_total[1m])),1e-9)",
              "legendFormat": "{{service}} 5xx",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              }
            },
            {
              "refId": "B",
              "expr": "sum by (service) (rate(http_requests_total{status=~\"4..\"}[1m])) / clamp_min(sum by (service) (rate(http_requests_total[1m])),1e-9)",
              "legendFormat": "{{service}} 4xx",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Latency p50 / p95 / p99 by service",
          "id": 10,
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 13
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.50, sum by (service, le) (rate(http_request_duration_seconds_bucket[1m])))",
              "legendFormat": "{{service}} p50",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              }
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket[1m])))",
              "legendFormat": "{{service}} p95",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              }
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (service, le) (rate(http_request_duration_seconds_bucket[1m])))",
              "legendFormat": "{{service}} p99",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "RPS by route",
          "id": 11,
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 13
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (service, route, method) (rate(http_requests_total[1m]))",
              "legendFormat": "{{service}} {{method}} {{route}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              }
            }
          ]
        },
        {
          "type": "row",
          "title": "Internal communication (gRPC + messaging)",
          "id": 12,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 21
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "gRPC calls by method",
          "id": 13,
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 22
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (service, method) (rate(grpc_server_requests_total[1m]))",
              "legendFormat": "{{service}} {{method}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "gRPC p95 latency",
          "id": 14,
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 22
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (service, method, le) (rate(grpc_server_handling_seconds_bucket[1m])))",
              "legendFormat": "{{service}} {{method}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Events published (Kafka / SQS)",
          "id": 15,
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 22
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (broker, type, result) (rate(events_published_total[1m]))",
              "legendFormat": "{{broker}} {{type}} {{result}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              }
            }
          ]
        },
        {
          "type": "row",
          "title": "Autoscaling and Kubernetes cluster health",
          "id": 16,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 30
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "HPA replicas (current vs desired)",
          "id": 17,
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 31
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"smart-campus\"}",
              "legendFormat": "{{horizontalpodautoscaler}} current",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              }
            },
            {
              "refId": "B",
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"smart-campus\"}",
              "legendFormat": "{{horizontalpodautoscaler}} desired",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Pod CPU (cores) in smart-campus",
          "id": 18,
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 31
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"smart-campus\",container!=\"\"}[2m]))",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Pod memory in smart-campus",
          "id": 19,
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 31
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"smart-campus\",container!=\"\"})",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Node CPU utilisation",
          "id": 20,
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 39
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[2m])))",
              "legendFormat": "{{instance}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Node memory utilisation",
          "id": 21,
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 39
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
