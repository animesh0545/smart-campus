# API gateway: the public entry point (the PDF requires a web service on a public URL).
# Service type LoadBalancer -> AWS load balancer in the public subnets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app: gateway, app.kubernetes.io/part-of: smart-campus, owner: animesh }
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway, app.kubernetes.io/part-of: smart-campus }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: config
          configMap:
            name: gateway-nginx   # generated by kustomization.yaml (hash suffix rolls pods on change)
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: { app: gateway }
spec:
  type: LoadBalancer
  selector: { app: gateway }
  ports:
    - { name: http, port: 80, targetPort: http }
