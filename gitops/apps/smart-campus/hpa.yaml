# Requirement c: HPAs on the two critical services, scaling on CPU utilisation
# (measured against the 100m CPU request). metrics-server supplies the data.
# Load test: loadtest/k6-load.js drives /api/availability and room bookings.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: availability
  labels: { app: availability, owner: animesh }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: availability }
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{ type: Pods, value: 2, periodSeconds: 30 }]
    scaleDown:
      stabilizationWindowSeconds: 120
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: room-booking
  labels: { app: room-booking, owner: animesh }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: room-booking }
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 85 }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{ type: Pods, value: 2, periodSeconds: 30 }]
    scaleDown:
      stabilizationWindowSeconds: 120
