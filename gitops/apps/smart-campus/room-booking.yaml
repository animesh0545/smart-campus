# room-booking: Room reservations; HPA-scaled
# Owner: Animesh Bhargava
apiVersion: apps/v1
kind: Deployment
metadata:
  name: room-booking
  labels: { app: room-booking, app.kubernetes.io/part-of: smart-campus, owner: animesh }
spec:
  # replicas managed by the HorizontalPodAutoscaler (hpa.yaml)
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: room-booking }
  template:
    metadata:
      labels: { app: room-booking, metrics: "true", app.kubernetes.io/part-of: smart-campus }
    spec:
      serviceAccountName: smart-campus-app
      containers:
        - name: room-booking
          image: smart-campus/room-booking
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: platform-config }
            - secretRef: { name: platform-secrets }
          env:
            - name: SERVICE_NAME
              value: "room-booking"
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: room-booking
  labels: { app: room-booking }
spec:
  selector: { app: room-booking }
  ports:
    - { name: http, port: 8000, targetPort: http }
