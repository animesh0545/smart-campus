# API gateway for local docker-compose (same routes as EKS, Docker DNS names).
# Variables + resolver = lazy DNS, so nginx starts even if a service is not up yet.
map $http_x_correlation_id $cid {
    default $http_x_correlation_id;
    ""      $request_id;
}

log_format json escape=json '{"ts":"$time_iso8601","service":"gateway","cid":"$cid",'
                            '"method":"$request_method","path":"$request_uri","status":$status,'
                            '"upstream":"$upstream_addr","duration_ms":$request_time}';

server {
    listen 8080;
    access_log /dev/stdout json;
    client_max_body_size 10m;

    resolver 127.0.0.11 valid=10s ipv6=off;  # Docker embedded DNS

    set $users        http://user-service:8000;
    set $registry     http://resource-registry:8000;
    set $rooms        http://room-booking:8000;
    set $equipment    http://equipment-booking:8000;
    set $availability http://availability:8000;
    set $partitions   http://partition-manager:8000;
    set $analytics    http://usage-analytics:8000;

    proxy_set_header X-Correlation-Id $cid;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
    add_header X-Correlation-Id $cid always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location = / {
        default_type application/json;
        return 200 '{"service":"Smart Campus Booking API","routes":["/api/users","/api/resources","/api/rooms/bookings","/api/equipment/bookings","/api/availability","/api/partitions/ring","/api/analytics/summary"]}';
    }

    location /api/users      { proxy_pass $users; }
    location /api/resources  { proxy_pass $registry; }
    location /api/rooms      { proxy_pass $rooms; }
    location /api/equipment  { proxy_pass $equipment; }
    location /api/availability { proxy_pass $availability; }
    location /api/partitions { proxy_pass $partitions; }
    location /api/analytics  { proxy_pass $analytics; }
}
