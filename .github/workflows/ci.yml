# CI half of GitOps (requirement d):
#   test -> build 7 images -> push to ECR (tag = git SHA) -> commit the new tags
#   into gitops/apps/smart-campus/kustomization.yaml -> ArgoCD notices and syncs.
# The workflow never talks to the cluster: no kubectl, no kubeconfig.
# AWS auth is GitHub OIDC -> IAM role (Terraform output github_actions_role_arn,
# stored as repository variable AWS_ROLE_ARN). No AWS keys in GitHub.
name: ci

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "proto/**"
      - "analytics-flink/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write   # commit the image-tag bump
  id-token: write   # OIDC to AWS

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r services/requirements.txt pytest moto
      - run: python -m pytest -q services/tests

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [user-service, resource-registry, room-booking, equipment-booking,
                  availability, partition-manager, usage-analytics]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/smart-campus/${{ matrix.service }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/smart-campus/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
    outputs:
      registry: ${{ steps.ecr.outputs.registry }}

  flink-jar:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "11", cache: maven }
      - run: mvn -B -q -f analytics-flink/pom.xml package
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload jar to the artifacts bucket (if set)
        if: vars.ARTIFACTS_BUCKET != ''
        run: aws s3 cp analytics-flink/target/usage-analytics.jar s3://${{ vars.ARTIFACTS_BUCKET }}/flink/usage-analytics.jar
      - uses: actions/upload-artifact@v4
        with:
          name: usage-analytics-jar
          path: analytics-flink/target/usage-analytics.jar

  bump-gitops:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Point kustomization at the new images
        run: |
          python3 scripts/set_image_tags.py \
            --registry "${{ needs.build.outputs.registry }}" --tag "${{ github.sha }}"
      - name: Commit (ArgoCD picks this up)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/smart-campus/kustomization.yaml
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "deploy: images ${GITHUB_SHA::7} [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
